<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f2f5f1" />
    <title>Epikrise | Draft workspace</title>
    <script>
      // Mirrors themePreferenceKey in src/lib/theme.ts so the first paint matches the saved theme.
      (function () {
        try {
          var stored = localStorage.getItem("epikrise.ui-theme");
          var dark =
            stored === "dark" ||
            (stored !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
        } catch {
          // Storage or matchMedia can be unavailable; the app applies the theme after mount.
        }
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
