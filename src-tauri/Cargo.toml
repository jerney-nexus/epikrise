[package]
name = "epikrise"
version = "0.1.0"
description = "Local-only assistant that turns anonymized clinical material into a structured diagnosis and findings list"
authors = ["Pascal Jerney"]
edition = "2024"
license = "MIT"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "epikrise_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[workspace]
members = ["crates/epikrise-core", "crates/epikrise-ingest", "crates/epikrise-llm"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Pascal Jerney"]

[workspace.dependencies]
epikrise-core = { path = "crates/epikrise-core" }
epikrise-ingest = { path = "crates/epikrise-ingest" }
epikrise-llm = { path = "crates/epikrise-llm" }
infer = "0.19"
pdf-extract = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "2.0.0-rc.25", features = ["derive"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
# Panicking paths are unacceptable in a clinical tool; tests are exempted via clippy.toml.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "warn"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
epikrise-core = { workspace = true }
epikrise-ingest = { workspace = true }
epikrise-llm = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
specta = { workspace = true }
specta-typescript = "0.0.12"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-specta = { version = "2.0.0-rc.25", features = ["typescript"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
