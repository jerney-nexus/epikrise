name: Rust tests

on:
  pull_request:
    branches: [main, development]
  push:
    branches: [main, development]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: rust-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust checks and tests
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      npm_config_store_dir: ${{ github.workspace }}/node_modules/.pnpm-store
    container:
      image: rust:1-bookworm
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: pnpm/action-setup@v6
        with:
          version: 12.8.1

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target/host-*
          key: ${{ runner.os }}-${{ runner.arch }}-rust-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-rust-

      - name: Install Linux build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake curl file libssl-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev ninja-build \
            pkg-config tesseract-ocr

      - name: Prepare Tesseract sidecar for checks
        run: |
          host_target="$(rustc -vV | sed -n 's/^host: //p')"
          mkdir -p src-tauri/binaries
          install -m 0755 "$(command -v tesseract)" \
            "src-tauri/binaries/tesseract-$host_target"
          mkdir -p src-tauri/resources/ocr/pdfium src-tauri/resources/ocr/tessdata
          touch src-tauri/resources/ocr/pdfium/libpdfium.so \
            src-tauri/resources/ocr/tessdata/deu.traineddata \
            src-tauri/resources/ocr/tessdata/eng.traineddata

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Check Rust formatting and lints
        run: pnpm check:rust:fmt && pnpm check:rust:clippy

      - name: Run Rust workspace tests
        run: pnpm test:rust
