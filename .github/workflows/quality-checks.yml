name: Release quality checks

on:
  pull_request:
    branches: [main, development]
  push:
    branches: [main, development]
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-22.04
    container:
      image: node:22-bookworm
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: pnpm/setup@v2
        with:
          version: 12.8.1
          install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint, format, and frontend build
        run: pnpm lint && pnpm format:check && pnpm build
