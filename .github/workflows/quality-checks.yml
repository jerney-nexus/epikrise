name: Release quality checks

on:
  pull_request:
    branches: [main, development]
  push:
    branches: [main, development]
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-22.04
    container:
      image: node:22-bookworm
    steps:
      - uses: actions/checkout@v7
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: pnpm/setup@v2
        with:
          version: 12.9.1
          install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install actionlint
        run: |
          curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash \
            | bash -s -- 1.7.12 "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Lint GitHub Actions workflows
        run: pnpm lint:actions

      - name: Run lint, format, and frontend build
        run: pnpm lint && pnpm format:check && pnpm build
