name: Release quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, development, documentation]
  workflow_call:

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Lint GitHub Actions workflows
        uses: raven-actions/actionlint@v2
        with:
          version: 1.7.12
          pyflakes: false

  quality:
    runs-on: ubuntu-24.04
    container:
      image: node:22-bookworm
    steps:
      - uses: actions/checkout@v7
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: pnpm/setup@v2
        with:
          version: 12.15.0
          install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint shell scripts
        run: |
          apt-get update
          apt-get install -y --no-install-recommends shellcheck
          pnpm lint:shell

      - name: Run lint, format, and frontend build
        run: pnpm lint && pnpm format:check && pnpm build
