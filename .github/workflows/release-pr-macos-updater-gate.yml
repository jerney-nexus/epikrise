name: Release PR macOS updater bundle gate

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  actions: read
  contents: read

jobs:
  release-pr-macos-updater-bundle-smoke:
    name: Release PR macOS updater bundle smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - name: Pass non-release pull requests immediately
        if: ${{ !startsWith(github.head_ref, 'release/') }}
        run: echo "Non-release pull request; macOS updater bundle smoke is not required."

      - uses: actions/checkout@v7
        if: ${{ startsWith(github.head_ref, 'release/') }}
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Wait for macOS updater bundle smoke
        if: ${{ startsWith(github.head_ref, 'release/') }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REF: ${{ github.head_ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/wait-for-release-pr-macos-smoke.mjs
