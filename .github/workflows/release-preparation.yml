name: Release preparation

on:
  workflow_dispatch:
    inputs:
      version:
        description: CalVer version (YYYY.MM.PATCH); leave empty to select the next version
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare-release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff
          version: 2.10.1
      - id: prepare
        name: Bump version and generate changelog
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/prepare-release.mjs "$RELEASE_VERSION"
      - uses: peter-evans/create-pull-request@v8
        with:
          base: ${{ github.event.repository.default_branch }}
          branch: release/${{ steps.prepare.outputs.version }}
          commit-message: "chore(release): ${{ steps.prepare.outputs.version }}"
          title: Release ${{ steps.prepare.outputs.version }}
          body: Automated CalVer version bump and changelog update.
