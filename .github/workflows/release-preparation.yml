name: Release preparation

on:
  workflow_dispatch:
    inputs:
      version:
        description: CalVer version (YYYY.M.MICRO); leave empty to select the next version
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          fetch-depth: 0
      - uses: pnpm/setup@v2
        with:
          version: 12.15.0
          install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff@2.10.1
      - id: prepare
        name: Bump version and generate changelog
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/prepare-release.mjs "$RELEASE_VERSION"
      - name: Verify release metadata formatting
        run: pnpm format:check:file CHANGELOG.md src-tauri/tauri.conf.json
      # Pull requests opened with GITHUB_TOKEN do not trigger workflows, which
      # leaves the release PR macOS updater gate without an opened event.
      - uses: actions/create-github-app-token@v3
        id: release-app-token
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.release-app-token.outputs.token }}
          base: ${{ github.event.repository.default_branch }}
          branch: release/${{ steps.prepare.outputs.version }}
          commit-message: "chore(release): ${{ steps.prepare.outputs.version }}"
          title: Release ${{ steps.prepare.outputs.version }}
          body: Automated CalVer version bump and changelog update.
