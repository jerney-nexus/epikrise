name: Store submission packages
run-name: Store submission packages ${{ github.event.workflow_run.head_branch }}

on:
  workflow_run:
    workflows:
      - Signed updater release
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: store-submission-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    uses: ./.github/workflows/store-msix.yml
    permissions:
      contents: read
    with:
      commit: ${{ github.event.workflow_run.head_sha }}
      release_tag: ${{ github.event.workflow_run.head_branch }}

  publish:
    needs: build
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    name: Attach Store packages to GitHub Release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v7
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - uses: pnpm/setup@v2
        with:
          version: 12.15.0
          install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install source tooling
        run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v8
        with:
          pattern: epikrise-store-msix-*
          path: store-artifacts
          merge-multiple: false

      - name: Validate release and stage downloadable Store packages
        shell: bash
        run: |
          set -euo pipefail
          request_id="$(node --input-type=module <<'NODE'
            const sha = process.env.RELEASE_SHA;
            process.stdout.write(`${sha.slice(0, 8)}-${sha.slice(8, 12)}-${sha.slice(12, 16)}-${sha.slice(16, 20)}-${sha.slice(20, 32)}`);
          NODE
          )"
          node scripts/desktop-builds.mjs stage-store-release \
            --x64-root store-artifacts/epikrise-store-msix-x64 \
            --arm64-root store-artifacts/epikrise-store-msix-arm64 \
            --output-root store-release-assets \
            --tag "$RELEASE_TAG" \
            --commit "$RELEASE_SHA" \
            --request-id "$request_id"

      - uses: actions/download-artifact@v8
        with:
          name: epikrise-store-msixbundle
          path: store-bundle

      - name: Stage Store bundle as a release asset
        shell: bash
        run: |
          set -euo pipefail
          bundles=(store-bundle/Epikrise_*_bundle.msixbundle)
          [[ ${#bundles[@]} -eq 1 && -f "${bundles[0]}" ]]
          bundle_name="$(basename "${bundles[0]}")"
          (cd store-bundle && sha256sum -c "$bundle_name.sha256")
          cp "${bundles[0]}" "store-bundle/$bundle_name.sha256" store-release-assets/

      - name: Verify published release identity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_file="$RUNNER_TEMP/store-release.json"
          gh release view "$RELEASE_TAG" --json isDraft,tagName,body > "$release_file"
          node --input-type=module - "$release_file" <<'NODE'
          import { readFileSync } from "node:fs";
          const release = JSON.parse(readFileSync(process.argv[2], "utf8"));
          const tag = process.env.RELEASE_TAG;
          const commit = process.env.RELEASE_SHA;
          const marker = `<!-- epikrise-signed-release-commit:${commit} -->`;
          if (
            release.isDraft ||
            release.tagName !== tag ||
            typeof release.body !== "string" ||
            !release.body.includes(marker)
          ) {
            throw new Error("The published release does not match the successful signed release run.");
          }
          NODE

      - name: Attach and verify Store submission assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" store-release-assets/* --clobber
          downloaded="$RUNNER_TEMP/store-release-assets"
          mkdir -p "$downloaded"
          gh release download "$RELEASE_TAG" \
            --pattern 'Epikrise_*.msix' \
            --pattern 'Epikrise_*.msix.manifest.json' \
            --pattern 'Epikrise_*_bundle.msixbundle' \
            --pattern 'Epikrise_*_bundle.msixbundle.sha256' \
            --dir "$downloaded"
          (cd "$downloaded" && sha256sum -c Epikrise_*_bundle.msixbundle.sha256)
          request_id="$(node --input-type=module <<'NODE'
            const sha = process.env.RELEASE_SHA;
            process.stdout.write(`${sha.slice(0, 8)}-${sha.slice(8, 12)}-${sha.slice(12, 16)}-${sha.slice(16, 20)}-${sha.slice(20, 32)}`);
          NODE
          )"
          node scripts/desktop-builds.mjs verify-store-release \
            --root "$downloaded" \
            --tag "$RELEASE_TAG" \
            --commit "$RELEASE_SHA" \
            --request-id "$request_id"

  submit:
    needs: [build, publish]
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    name: Submit Store bundle to Partner Center
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
      STORE_PRODUCT_ID: ${{ vars.STORE_PRODUCT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Require Store product ID
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$STORE_PRODUCT_ID" ]]

      - uses: actions/download-artifact@v8
        with:
          name: epikrise-store-msixbundle
          path: store-bundle

      - name: Locate Store bundle
        shell: bash
        run: |
          set -euo pipefail
          bundles=(store-bundle/Epikrise_*_bundle.msixbundle)
          [[ ${#bundles[@]} -eq 1 && -f "${bundles[0]}" ]]
          printf 'STORE_BUNDLE_PATH=%s\n' "$PWD/${bundles[0]}" >> "$GITHUB_ENV"

      - uses: microsoft/microsoft-store-apppublisher@cc9910a8d59f2eb55cbb83df0a3800cf3b5300e0 # v1.4

      - name: Configure Partner Center credentials
        env:
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
          AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          msstore reconfigure \
            --tenantId "$AZURE_AD_TENANT_ID" \
            --sellerId "$SELLER_ID" \
            --clientId "$AZURE_AD_APPLICATION_CLIENT_ID" \
            --clientSecret "$AZURE_AD_APPLICATION_SECRET"

      - name: Upload bundle as draft
        shell: bash
        run: |
          set -euo pipefail
          msstore publish "$STORE_BUNDLE_PATH" -id "$STORE_PRODUCT_ID" --noCommit

      - name: Sync listing metadata from store-assets
        shell: bash
        run: |
          set -euo pipefail
          msstore submission get "$STORE_PRODUCT_ID" > submission.json
          node scripts/update-store-metadata.mjs submission.json store-assets/listing.json > submission-updated.json
          msstore submission updateMetadata "$STORE_PRODUCT_ID" "$(jq -c . submission-updated.json)"

      - name: Commit submission and wait for certification
        shell: bash
        run: |
          set -euo pipefail
          msstore submission publish "$STORE_PRODUCT_ID"
          msstore submission poll "$STORE_PRODUCT_ID"
