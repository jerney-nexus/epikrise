name: Store submission packages
run-name: Store submission packages ${{ github.event.workflow_run.head_branch }}

on:
  workflow_run:
    workflows:
      - Signed updater release
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: store-partner-center-submission
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    name: Attach Store packages to GitHub Release
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      attestations: read
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v7
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - uses: pnpm/setup@v2
        with:
          version: 12.15.0
          install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install source tooling
        run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v8
        with:
          pattern: epikrise-store-msix-*
          path: store-artifacts
          merge-multiple: false
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Validate release and stage downloadable Store packages
        shell: bash
        run: |
          set -euo pipefail
          request_id="$(node --input-type=module <<'NODE'
            const sha = process.env.RELEASE_SHA;
            process.stdout.write(`${sha.slice(0, 8)}-${sha.slice(8, 12)}-${sha.slice(12, 16)}-${sha.slice(16, 20)}-${sha.slice(20, 32)}`);
          NODE
          )"
          node scripts/desktop-builds.mjs stage-store-release \
            --x64-root store-artifacts/epikrise-store-msix-x64 \
            --arm64-root store-artifacts/epikrise-store-msix-arm64 \
            --output-root store-release-assets \
            --tag "$RELEASE_TAG" \
            --commit "$RELEASE_SHA" \
            --request-id "$request_id"

      - uses: actions/download-artifact@v8
        with:
          name: epikrise-store-msixbundle
          path: store-bundle
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Stage Store bundle as a release asset
        shell: bash
        run: |
          set -euo pipefail
          bundles=(store-bundle/Epikrise_*_bundle.msixbundle)
          [[ ${#bundles[@]} -eq 1 && -f "${bundles[0]}" ]]
          bundle_name="$(basename "${bundles[0]}")"
          (cd store-bundle && sha256sum -c "$bundle_name.sha256")
          cp "${bundles[0]}" "store-bundle/$bundle_name.sha256" store-release-assets/

      - name: Verify Store bundle provenance
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          bundles=(store-bundle/Epikrise_*_bundle.msixbundle)
          [[ ${#bundles[@]} -eq 1 && -f "${bundles[0]}" ]]
          gh attestation verify "${bundles[0]}" --repo "$GITHUB_REPOSITORY"

      - name: Verify published release identity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_file="$RUNNER_TEMP/store-release.json"
          gh release view "$RELEASE_TAG" --json isDraft,tagName,body > "$release_file"
          node --input-type=module - "$release_file" <<'NODE'
          import { readFileSync } from "node:fs";
          const release = JSON.parse(readFileSync(process.argv[2], "utf8"));
          const tag = process.env.RELEASE_TAG;
          const commit = process.env.RELEASE_SHA;
          const marker = `<!-- epikrise-signed-release-commit:${commit} -->`;
          if (
            release.isDraft ||
            release.tagName !== tag ||
            typeof release.body !== "string" ||
            !release.body.includes(marker)
          ) {
            throw new Error("The published release does not match the successful signed release run.");
          }
          NODE

      - name: Attach and verify Store submission assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" store-release-assets/* --clobber
          downloaded="$RUNNER_TEMP/store-release-assets"
          mkdir -p "$downloaded"
          gh release download "$RELEASE_TAG" \
            --pattern 'Epikrise_*.msix' \
            --pattern 'Epikrise_*.msix.manifest.json' \
            --pattern 'Epikrise_*_bundle.msixbundle' \
            --pattern 'Epikrise_*_bundle.msixbundle.sha256' \
            --dir "$downloaded"
          (cd "$downloaded" && sha256sum -c Epikrise_*_bundle.msixbundle.sha256)
          request_id="$(node --input-type=module <<'NODE'
            const sha = process.env.RELEASE_SHA;
            process.stdout.write(`${sha.slice(0, 8)}-${sha.slice(8, 12)}-${sha.slice(12, 16)}-${sha.slice(16, 20)}-${sha.slice(20, 32)}`);
          NODE
          )"
          node scripts/desktop-builds.mjs verify-store-release \
            --root "$downloaded" \
            --tag "$RELEASE_TAG" \
            --commit "$RELEASE_SHA" \
            --request-id "$request_id"

  submit:
    needs: publish
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    name: Submit Store bundle to Partner Center
    environment:
      name: store-partner-center
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    env:
      RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
      STORE_PRODUCT_ID: ${{ vars.STORE_PRODUCT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Require Store product ID
        shell: pwsh
        run: |
          if (-not $env:STORE_PRODUCT_ID) {
            throw "STORE_PRODUCT_ID repository variable is not set."
          }

      - uses: actions/download-artifact@v8
        with:
          name: epikrise-store-msixbundle
          path: store-bundle
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Locate Store bundle
        shell: pwsh
        run: |
          $bundles = @(Get-ChildItem -Path store-bundle -Filter 'Epikrise_*_bundle.msixbundle' -File)
          if ($bundles.Count -ne 1) {
            throw "Expected exactly one Store bundle, found $($bundles.Count)."
          }
          "STORE_BUNDLE_PATH=$($bundles[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: microsoft/microsoft-store-apppublisher@cc9910a8d59f2eb55cbb83df0a3800cf3b5300e0 # v1.4

      - name: Configure Partner Center credentials
        env:
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
          AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
        shell: pwsh
        run: |
          msstore reconfigure `
            --tenantId $env:AZURE_AD_TENANT_ID `
            --sellerId $env:SELLER_ID `
            --clientId $env:AZURE_AD_APPLICATION_CLIENT_ID `
            --clientSecret $env:AZURE_AD_APPLICATION_SECRET
          if ($LASTEXITCODE -ne 0) { throw "msstore reconfigure failed." }

      - name: Require release to advance the Store version
        shell: pwsh
        run: |
          msstore submission get $env:STORE_PRODUCT_ID | Out-File -FilePath submission-before.json -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw "msstore submission get failed." }
          $releaseVersion = $env:RELEASE_TAG.TrimStart("v")
          node scripts/check-store-version.mjs $releaseVersion submission-before.json
          if ($LASTEXITCODE -ne 0) { throw "Store version guard failed." }

      - name: Upload bundle as draft
        shell: pwsh
        run: |
          msstore publish $env:STORE_BUNDLE_PATH -id $env:STORE_PRODUCT_ID --noCommit
          if ($LASTEXITCODE -ne 0) { throw "msstore publish failed." }

      - name: Sync listing metadata from store-assets
        shell: pwsh
        run: |
          msstore submission get $env:STORE_PRODUCT_ID | Out-File -FilePath submission.json -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw "msstore submission get failed." }
          node scripts/update-store-metadata.mjs submission.json store-assets/listing.json | Out-File -FilePath submission-updated.json -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw "update-store-metadata.mjs failed." }
          $updated = Get-Content submission-updated.json -Raw | ConvertFrom-Json | ConvertTo-Json -Compress -Depth 100
          # Keep embedded JSON quotes intact when msstore receives the argument.
          $PSNativeCommandArgumentPassing = 'Standard'
          msstore submission updateMetadata $env:STORE_PRODUCT_ID $updated
          if ($LASTEXITCODE -ne 0) { throw "msstore submission updateMetadata failed." }

      - name: Commit submission and wait for certification
        shell: pwsh
        run: |
          msstore submission publish $env:STORE_PRODUCT_ID
          if ($LASTEXITCODE -ne 0) { throw "msstore submission publish failed." }
          msstore submission poll $env:STORE_PRODUCT_ID
          if ($LASTEXITCODE -ne 0) { throw "msstore submission poll failed." }
