name: Signed updater release
run-name: Signed updater release ${{ github.ref_name }}

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: updater-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: pnpm/setup@v2
        with:
          version: 12.15.0
          install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate CalVer version tag
        run: node scripts/release-artifacts.mjs validate --tag "$GITHUB_REF_NAME"

      - name: Reject unrelated releases and allow matching drafts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_file="$RUNNER_TEMP/existing-release.json"
          if gh release view "$GITHUB_REF_NAME" --json isDraft,tagName,body > "$release_file" 2>/dev/null; then
            node scripts/release-artifacts.mjs validate-draft \
              --tag "$GITHUB_REF_NAME" \
              --commit "$GITHUB_SHA" \
              --release-file "$release_file"
          fi

  verify-frontend:
    uses: ./.github/workflows/frontend-tests.yml
    permissions:
      contents: read

  verify-rust:
    uses: ./.github/workflows/rust-tests.yml
    permissions:
      contents: read

  verify-security:
    uses: ./.github/workflows/security-audit.yml
    permissions:
      contents: read

  verify-quality:
    uses: ./.github/workflows/quality-checks.yml
    permissions:
      contents: read

  # The updater matrix is gated by its own `environment: release`. This job waits
  # on the same environment at the same time, so one approval releases both the
  # updater builds and the Store MSIX build instead of requiring a second round.
  approve-builds:
    name: Approve release builds
    needs:
      - validate
      - verify-frontend
      - verify-rust
      - verify-security
      - verify-quality
    runs-on: ubuntu-24.04
    environment:
      name: release
      url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
    steps:
      - run: echo "Release builds approved."

  # Calling a reusable workflow nests its matrix jobs under this job's name in the
  # Actions sidebar, so the updater builds group the same way as the Store build.
  build:
    name: Build signed updater packages
    needs:
      - validate
      - verify-frontend
      - verify-rust
      - verify-security
      - verify-quality
    permissions:
      contents: read
    uses: ./.github/workflows/updater-build.yml
    secrets: inherit

  store-msix:
    name: Build Store MSIX packages
    needs: [approve-builds]
    uses: ./.github/workflows/store-msix.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      commit: ${{ github.sha }}
      release_tag: ${{ github.ref_name }}

  flatpak:
    name: Build Flatpak bundle
    needs: [approve-builds]
    uses: ./.github/workflows/flatpak.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      commit: ${{ github.sha }}
      release_tag: ${{ github.ref_name }}

  stage:
    name: Stage signed updater, Store, and Flatpak release
    needs: [build, store-msix, flatpak]
    runs-on: ubuntu-24.04
    permissions:
      attestations: read
      contents: write
    steps:
      - uses: actions/checkout@v7
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: pnpm/setup@v2
        with:
          version: 12.15.0
          install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Minisign verifier
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends minisign

      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-artifacts
          merge-multiple: false

      - uses: actions/download-artifact@v8
        with:
          pattern: epikrise-store-msix-*
          path: store-artifacts
          merge-multiple: false

      - uses: actions/download-artifact@v8
        with:
          name: epikrise-store-msixbundle
          path: store-bundle

      - uses: actions/download-artifact@v8
        with:
          name: epikrise-flatpak
          path: flatpak-bundle

      - name: Verify Store bundle checksum and provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bundles=(store-bundle/Epikrise_*_bundle.msixbundle)
          [[ ${#bundles[@]} -eq 1 && -f "${bundles[0]}" ]]
          bundle_name="$(basename "${bundles[0]}")"
          (cd store-bundle && sha256sum -c "$bundle_name.sha256")
          gh attestation verify "${bundles[0]}" --repo "$GITHUB_REPOSITORY"

      - name: Verify Flatpak checksum and provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bundle="flatpak-bundle/nexus.jerney.epikrise.flatpak"
          (cd flatpak-bundle && sha256sum -c nexus.jerney.epikrise.flatpak.sha256)
          gh attestation verify "$bundle" --repo "$GITHUB_REPOSITORY"

      - name: Stage Store MSIX packages and bundle as release assets
        run: |
          set -euo pipefail
          request_id="$(node --input-type=module <<'NODE'
            const sha = process.env.GITHUB_SHA;
            process.stdout.write(`${sha.slice(0, 8)}-${sha.slice(8, 12)}-${sha.slice(12, 16)}-${sha.slice(16, 20)}-${sha.slice(20, 32)}`);
          NODE
          )"
          store_dir="release-artifacts/release-store-msix"
          node scripts/desktop-builds.mjs stage-store-release \
            --x64-root store-artifacts/epikrise-store-msix-x64 \
            --arm64-root store-artifacts/epikrise-store-msix-arm64 \
            --output-root "$store_dir" \
            --tag "$GITHUB_REF_NAME" \
            --commit "$GITHUB_SHA" \
            --request-id "$request_id"
          cp store-bundle/Epikrise_*_bundle.msixbundle store-bundle/Epikrise_*_bundle.msixbundle.sha256 "$store_dir"/
          # Two architectures, each with a .msix and .msix.manifest.json, plus the bundle and its .sha256.
          [[ "$(find "$store_dir" -maxdepth 1 -type f | wc -l)" -eq 6 ]]

      - name: Stage Flatpak bundle as release asset
        run: |
          set -euo pipefail
          flatpak_dir="release-artifacts/release-flatpak"
          mkdir -p "$flatpak_dir"
          cp flatpak-bundle/nexus.jerney.epikrise.flatpak \
            flatpak-bundle/nexus.jerney.epikrise.flatpak.sha256 "$flatpak_dir"/
          # The bundle and its .sha256.
          [[ "$(find "$flatpak_dir" -maxdepth 1 -type f | wc -l)" -eq 2 ]]

      - name: Generate static updater manifest
        run: |
          node scripts/release-artifacts.mjs latest \
            --tag "$GITHUB_REF_NAME" \
            --commit "$GITHUB_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --artifacts-root release-artifacts \
            --output latest.json

      - name: Create or recover draft and verify release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_file="$RUNNER_TEMP/existing-release.json"
          if gh release view "$GITHUB_REF_NAME" --json isDraft,tagName,body > "$release_file" 2>/dev/null; then
            node scripts/release-artifacts.mjs validate-draft \
              --tag "$GITHUB_REF_NAME" \
              --commit "$GITHUB_SHA" \
              --release-file "$release_file"
            gh release upload "$GITHUB_REF_NAME" \
              release-artifacts/*/* latest.json \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              release-artifacts/*/* latest.json \
              --draft \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              --notes "<!-- epikrise-signed-release-commit:$GITHUB_SHA -->" \
              --latest=false
          fi

          uploaded_release_file="$RUNNER_TEMP/uploaded-release.json"
          uploaded_assets_dir="$RUNNER_TEMP/uploaded-release-assets"
          mkdir -p "$uploaded_assets_dir"
          gh release view "$GITHUB_REF_NAME" --json assets > "$uploaded_release_file"
          gh release download "$GITHUB_REF_NAME" --dir "$uploaded_assets_dir"
          node scripts/release-artifacts.mjs verify-uploaded \
            --artifacts-root release-artifacts \
            --latest-file latest.json \
            --uploaded-root "$uploaded_assets_dir" \
            --release-file "$uploaded_release_file"

      - name: Create immutable release asset evidence
        run: |
          node scripts/release-artifacts.mjs asset-evidence \
            --artifacts-root release-artifacts \
            --latest-file latest.json \
            --output release-assets.json

      - uses: actions/upload-artifact@v7
        with:
          name: acceptance-evidence-${{ github.run_id }}
          path: release-assets.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
          overwrite: true

  approve:
    name: Approve accepted draft release
    needs: [stage, store-msix, flatpak]
    runs-on: ubuntu-24.04
    environment:
      name: release
      url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
    steps:
      - run: echo "Draft release approved for publication."

  publish:
    name: Publish accepted draft release
    needs: [stage, approve, store-msix, flatpak]
    runs-on: ubuntu-24.04
    concurrency:
      group: updater-release
      queue: max
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: pnpm/setup@v2
        with:
          version: 12.15.0
          install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v8
        with:
          name: acceptance-evidence-${{ github.run_id }}
          path: release-evidence

      - name: Publish accepted draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_file="$RUNNER_TEMP/accepted-draft.json"
          gh release view "$GITHUB_REF_NAME" --json isDraft,tagName,body > "$release_file"
          node scripts/release-artifacts.mjs validate-draft \
            --tag "$GITHUB_REF_NAME" \
            --commit "$GITHUB_SHA" \
            --release-file "$release_file"

          latest_file="$RUNNER_TEMP/latest-release.json"
          latest_tag=""
          if gh release view --json tagName > "$latest_file" 2>/dev/null; then
            latest_tag="$(node --input-type=module -e \
              'import { readFileSync } from "node:fs"; process.stdout.write(JSON.parse(readFileSync(process.argv[1], "utf8")).tagName)' \
              "$latest_file")"
          else
            releases_file="$RUNNER_TEMP/releases.json"
            gh release list --json tagName,isDraft --limit 1000 > "$releases_file"
            node --input-type=module -e '
              import { readFileSync } from "node:fs";
              const releases = JSON.parse(readFileSync(process.argv[1], "utf8"));
              if (releases.some((release) => !release.isDraft)) {
                console.error("Could not determine the latest published release.");
                process.exit(1);
              }
            ' "$releases_file"
          fi
          promotion_args=(should-promote-latest --tag "$GITHUB_REF_NAME")
          if [[ -n "$latest_tag" ]]; then
            promotion_args+=(--latest-tag "$latest_tag")
          fi
          promote_latest="$(node scripts/release-artifacts.mjs "${promotion_args[@]}")"
          release_id="$(gh release view "$GITHUB_REF_NAME" --json databaseId --jq .databaseId)"
          if [[ "$promote_latest" == 'true' ]]; then
            make_latest=true
          else
            make_latest=false
          fi

          release_assets_file="$RUNNER_TEMP/release-assets.json"
          uploaded_assets_dir="$RUNNER_TEMP/accepted-release-assets"
          mkdir -p "$uploaded_assets_dir"
          gh release view "$GITHUB_REF_NAME" --json assets > "$release_assets_file"
          gh release download "$GITHUB_REF_NAME" --dir "$uploaded_assets_dir"
          node scripts/release-artifacts.mjs verify-uploaded \
            --evidence-file release-evidence/release-assets.json \
            --uploaded-root "$uploaded_assets_dir" \
            --release-file "$release_assets_file"

          tag_ref_file="$RUNNER_TEMP/current-release-tag.json"
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" > "$tag_ref_file"
          read -r tag_type tag_sha < <(
            node --input-type=module -e '
              import { readFileSync } from "node:fs";
              const { object } = JSON.parse(readFileSync(process.argv[1], "utf8"));
              process.stdout.write(object.type + " " + object.sha + "\n");
            ' "$tag_ref_file"
          )
          while [[ "$tag_type" == "tag" ]]; do
            gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" > "$tag_ref_file"
            read -r tag_type tag_sha < <(
              node --input-type=module -e '
                import { readFileSync } from "node:fs";
                const { object } = JSON.parse(readFileSync(process.argv[1], "utf8"));
                process.stdout.write(object.type + " " + object.sha + "\n");
              ' "$tag_ref_file"
            )
          done
          if [[ "$tag_type" != "commit" || "$tag_sha" != "$GITHUB_SHA" ]]; then
            echo "Release tag no longer points to the workflow commit." >&2
            exit 1
          fi

          gh api --method PATCH \
            "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            -F draft=false \
            --raw-field "make_latest=$make_latest" > /dev/null
