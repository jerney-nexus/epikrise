name: Signed updater release
run-name: Signed updater release ${{ github.ref_name }}

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: updater-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: pnpm/setup@v2
        with:
          version: 12.10.1
          install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate padded version tag
        run: node scripts/release-artifacts.mjs validate --tag "$GITHUB_REF_NAME"

      - name: Reject unrelated releases and allow matching drafts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_file="$RUNNER_TEMP/existing-release.json"
          if gh release view "$GITHUB_REF_NAME" --json isDraft,tagName,body > "$release_file" 2>/dev/null; then
            node scripts/release-artifacts.mjs validate-draft \
              --tag "$GITHUB_REF_NAME" \
              --commit "$GITHUB_SHA" \
              --release-file "$release_file"
          fi

  verify-ui:
    uses: ./.github/workflows/ui-tests.yml
    permissions:
      contents: read

  verify-rust:
    uses: ./.github/workflows/rust-tests.yml
    permissions:
      contents: read

  verify-playwright:
    uses: ./.github/workflows/playwright-tests.yml
    permissions:
      contents: read

  verify-security:
    uses: ./.github/workflows/security-audit.yml
    permissions:
      contents: read

  verify-quality:
    uses: ./.github/workflows/quality-checks.yml
    permissions:
      contents: read

  build:
    needs:
      - validate
      - verify-ui
      - verify-rust
      - verify-playwright
      - verify-security
      - verify-quality
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    environment: release
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            platform: linux
            bundles: deb rpm appimage
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
            platform: linux
            bundles: deb rpm appimage
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            platform: macos
            bundles: dmg
          - target: aarch64-apple-darwin
            runner: macos-15
            platform: macos
            bundles: dmg
          - target: x86_64-pc-windows-msvc
            runner: windows-2022
            platform: windows
            windows_arch: x86_64
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            platform: windows
            windows_arch: aarch64

    env:
      TARGET: ${{ matrix.target }}
      PLATFORM: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: pnpm/setup@v2
        with:
          version: 12.10.1
          install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install source tooling
        run: pnpm install --frozen-lockfile

      - name: Prepare normalized release workspace
        shell: bash
        run: |
          set -euo pipefail
          build_root="$RUNNER_TEMP/epikrise-release"
          mkdir -p "$build_root"
          git archive "$GITHUB_SHA" | tar -x -C "$build_root"
          node scripts/prepare-release.mjs --prepare-build-inputs "$build_root"
          printf 'RELEASE_BUILD_ROOT=%s\n' "$build_root" >> "$GITHUB_ENV"

      - name: Cache native OCR and Cargo inputs
        if: matrix.platform != 'windows'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/epikrise/native-ocr
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-ocr-${{ hashFiles('pnpm-lock.yaml', 'src-tauri/Cargo.lock', 'scripts/build-native-ocr.sh') }}

      - name: Cache Windows OCR sources and toolchain
        if: matrix.platform == 'windows'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/epikrise/windows-ocr
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-windows-ocr-${{ hashFiles('pnpm-lock.yaml', 'src-tauri/Cargo.lock', 'scripts/build-windows-ocr.sh') }}

      - name: Install release workspace dependencies
        working-directory: ${{ runner.temp }}/epikrise-release
        run: pnpm install --frozen-lockfile

      - name: Build frontend without signing secrets
        working-directory: ${{ runner.temp }}/epikrise-release
        run: pnpm build

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake curl file libfuse2 libssl-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev ninja-build \
            pkg-config patchelf ripgrep rpm tesseract-ocr tesseract-ocr-deu tesseract-ocr-eng

      - name: Install macOS OCR language data
        if: matrix.platform == 'macos'
        run: brew install ripgrep tesseract tesseract-lang

      - name: Install native Windows packaging tools
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          choco install llvm nsis --yes --no-progress
          choco install wixtoolset --version=3.14.1 --yes --no-progress

      - name: Record native Windows toolchain versions
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -property installationPath
          $vsVersion = & $vswhere -latest -property installationVersion
          $sdkRoot = Join-Path ${env:ProgramFiles(x86)} "Windows Kits\10\Include"
          $sdkVersion = Get-ChildItem $sdkRoot -Directory | Sort-Object Name -Descending | Select-Object -First 1 -ExpandProperty Name
          $crtRoot = Join-Path $vsPath "VC\Tools\MSVC"
          $crtVersion = Get-ChildItem $crtRoot -Directory | Sort-Object Name -Descending | Select-Object -First 1 -ExpandProperty Name
          "WINDOWS_VISUAL_STUDIO_VERSION=$vsVersion" >> $env:GITHUB_ENV
          "WINDOWS_SDK_VERSION=$sdkVersion" >> $env:GITHUB_ENV
          "WINDOWS_CRT_VERSION=$crtVersion" >> $env:GITHUB_ENV

      - name: Download verified Windows OCR language data
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $tessdata = Join-Path $env:RUNNER_TEMP "epikrise-tessdata"
          New-Item -ItemType Directory -Force -Path $tessdata | Out-Null
          $models = @{
            "eng" = "7d4322bd2a7749724879683fc3912cb542f19906c83bcc1a52132556427170b2"
            "deu" = "19d219bbb6672c869d20a9636c6816a81eb9a71796cb93ebe0cb1530e2cdb22d"
          }
          $revision = "87416418657359cb625c412a48b6e1d6d41c29bd"
          foreach ($model in $models.Keys) {
            $destination = Join-Path $tessdata "$model.traineddata"
            Invoke-WebRequest -Uri "https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/$revision/$model.traineddata" -OutFile $destination
            if ((Get-FileHash -Algorithm SHA256 $destination).Hash.ToLowerInvariant() -ne $models[$model]) {
              throw "SHA-256 mismatch for $model.traineddata"
            }
          }
          "EPIKRISE_TESSDATA_DIR=$($tessdata -replace '\\', '/')" >> $env:GITHUB_ENV

      - name: Prepare target OCR resources
        working-directory: ${{ runner.temp }}/epikrise-release
        run: bash scripts/prepare-ocr.sh --target "$TARGET"

      - name: Build signed Windows updater bundles
        if: matrix.platform == 'windows'
        working-directory: ${{ runner.temp }}/epikrise-release
        env:
          WINDOWS_ARCH: ${{ matrix.windows_arch }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            printf 'TAURI_SIGNING_PRIVATE_KEY is required for signed releases.\n' >&2
            exit 1
          fi
          signing_private_key="$TAURI_SIGNING_PRIVATE_KEY"
          signing_private_key_password="${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}"
          unset TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          host_target="$(rustc -vV | sed -n 's/^host: //p')"
          release_root="src-tauri/target/host-$host_target/$TARGET/release"
          release_version="$(node -p "require('./package.json').version")"
          for installer_family in nsis msi; do
            updater_feature="updater-windows-${WINDOWS_ARCH}-${installer_family}"
            bundle_config="$(node scripts/windows-packages.mjs config "$WINDOWS_ARCH" "$installer_family" offline)"
            TAURI_SIGNING_PRIVATE_KEY="$signing_private_key" \
              TAURI_SIGNING_PRIVATE_KEY_PASSWORD="$signing_private_key_password" \
              bash scripts/with-cargo-host-target.sh \
                pnpm exec tauri build \
                  --target "$TARGET" \
                  --features "$updater_feature" \
                  --config src-tauri/tauri.release.conf.json \
                  --config '{"build":{"beforeBuildCommand":null}}' \
                  --config "$bundle_config" \
                  --no-bundle \
                  --ci \
                  --no-sign
            if [[ "$installer_family" == "msi" ]]; then
              node scripts/windows-packages.mjs stage-layout \
                "$TARGET" msi "$release_root/epikrise.exe" \
                "$PWD/src-tauri/resources/ocr" "$PWD/src-tauri/binaries" \
                "$release_root/windows-layout" "$GITHUB_SHA" "$release_version" \
                "$WINDOWS_SDK_VERSION" "$WINDOWS_CRT_VERSION" \
                "$WINDOWS_VISUAL_STUDIO_VERSION"
            fi
            for webview_mode in offline bootstrapper; do
              bundle_config="$(node scripts/windows-packages.mjs config "$WINDOWS_ARCH" "$installer_family" "$webview_mode")"
              TAURI_SIGNING_PRIVATE_KEY="$signing_private_key" \
                TAURI_SIGNING_PRIVATE_KEY_PASSWORD="$signing_private_key_password" \
                bash scripts/with-cargo-host-target.sh \
                  pnpm exec tauri bundle \
                    --target "$TARGET" \
                    --features "$updater_feature" \
                    --config src-tauri/tauri.release.conf.json \
                    --config '{"build":{"beforeBuildCommand":null}}' \
                    --config "$bundle_config" \
                    --bundles "$installer_family" \
                    --ci \
                    --no-sign
              node scripts/windows-packages.mjs stage \
                "$release_root/bundle/$installer_family" \
                "$release_root/windows-packages" \
                "$WINDOWS_ARCH" "$installer_family" "$webview_mode"
            done
          done
          unset signing_private_key signing_private_key_password

      - name: Build signed Linux or macOS updater bundles
        if: matrix.platform != 'windows'
        working-directory: ${{ runner.temp }}/epikrise-release
        env:
          BUNDLE_TARGETS: ${{ matrix.bundles }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            printf 'TAURI_SIGNING_PRIVATE_KEY is required for signed releases.\n' >&2
            exit 1
          fi
          signing_private_key="$TAURI_SIGNING_PRIVATE_KEY"
          signing_private_key_password="${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}"
          unset TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          host_target="$(rustc -vV | sed -n 's/^host: //p')"
          if [[ "$PLATFORM" == 'linux' ]]; then
            bundle_root="src-tauri/target/host-$host_target/$TARGET/release/bundle"
            saved_appimage="$RUNNER_TEMP/$TARGET-appimage"
            TAURI_SIGNING_PRIVATE_KEY="$signing_private_key" \
              TAURI_SIGNING_PRIVATE_KEY_PASSWORD="$signing_private_key_password" \
              bash scripts/with-cargo-host-target.sh \
                pnpm exec tauri build \
                  --target "$TARGET" \
                  --config src-tauri/tauri.release.conf.json \
                  --config '{"build":{"beforeBuildCommand":null}}' \
                  --bundles appimage \
                  --ci \
                  --no-sign
            cp -a "$bundle_root/appimage" "$saved_appimage"
            bash scripts/with-cargo-host-target.sh \
              pnpm exec tauri build \
                --target "$TARGET" \
                --config '{"build":{"beforeBuildCommand":null,"features":[]}}' \
                --bundles deb rpm \
                --ci \
                --no-sign
            rm -rf "$bundle_root/appimage"
            mv "$saved_appimage" "$bundle_root/appimage"
          else
            read -r -a bundles <<< "$BUNDLE_TARGETS"
            TAURI_SIGNING_PRIVATE_KEY="$signing_private_key" \
              TAURI_SIGNING_PRIVATE_KEY_PASSWORD="$signing_private_key_password" \
              bash scripts/with-cargo-host-target.sh \
                pnpm exec tauri build \
                  --target "$TARGET" \
                  --config src-tauri/tauri.release.conf.json \
                  --config '{"build":{"beforeBuildCommand":null}}' \
                  --bundles "${bundles[@]}" \
                  --ci \
                  --no-sign
          fi
          unset signing_private_key signing_private_key_password

      - name: Verify staged OCR architectures
        working-directory: ${{ runner.temp }}/epikrise-release
        shell: bash
        run: |
          set -euo pipefail
          case "$TARGET" in
            x86_64-unknown-linux-gnu)
              readelf -h "src-tauri/binaries/tesseract-$TARGET" | grep -F 'Advanced Micro Devices X86-64'
              readelf -h src-tauri/resources/ocr/pdfium/libpdfium.so | grep -F 'Advanced Micro Devices X86-64'
              ;;
            aarch64-unknown-linux-gnu)
              readelf -h "src-tauri/binaries/tesseract-$TARGET" | grep -F 'AArch64'
              readelf -h src-tauri/resources/ocr/pdfium/libpdfium.so | grep -F 'AArch64'
              ;;
            x86_64-apple-darwin)
              lipo "src-tauri/binaries/tesseract-$TARGET" -archs | grep -qw x86_64
              lipo src-tauri/resources/ocr/pdfium/libpdfium.dylib -archs | grep -qw x86_64
              ;;
            aarch64-apple-darwin)
              lipo "src-tauri/binaries/tesseract-$TARGET" -archs | grep -qw arm64
              lipo src-tauri/resources/ocr/pdfium/libpdfium.dylib -archs | grep -qw arm64
              ;;
            x86_64-pc-windows-msvc)
              llvm-readobj --file-headers "src-tauri/target/host-$TARGET/$TARGET/release/epikrise.exe" | grep -F IMAGE_FILE_MACHINE_AMD64
              llvm-readobj --file-headers "src-tauri/binaries/tesseract-$TARGET.exe" | grep -F IMAGE_FILE_MACHINE_AMD64
              llvm-readobj --file-headers src-tauri/resources/ocr/pdfium/pdfium.dll | grep -F IMAGE_FILE_MACHINE_AMD64
              ;;
            aarch64-pc-windows-msvc)
              llvm-readobj --file-headers "src-tauri/target/host-$TARGET/$TARGET/release/epikrise.exe" | grep -F IMAGE_FILE_MACHINE_ARM64
              llvm-readobj --file-headers "src-tauri/binaries/tesseract-$TARGET.exe" | grep -F IMAGE_FILE_MACHINE_ARM64
              llvm-readobj --file-headers src-tauri/resources/ocr/pdfium/pdfium.dll | grep -F IMAGE_FILE_MACHINE_ARM64
              ;;
          esac

      - name: Stage and verify updater packages
        if: matrix.platform != 'windows'
        working-directory: ${{ runner.temp }}/epikrise-release
        shell: bash
        run: |
          set -euo pipefail
          host_target="$(rustc -vV | sed -n 's/^host: //p')"
          node scripts/release-artifacts.mjs stage \
            --target "$TARGET" \
            --bundle-root "src-tauri/target/host-$host_target/$TARGET/release/bundle" \
            --stage-root "release-staging/$TARGET" \
            --commit "$GITHUB_SHA" \
            --resource-root src-tauri/resources/ocr \
            --binary-root src-tauri/binaries

      - name: Verify immutable Windows build inputs
        if: matrix.platform == 'windows'
        working-directory: ${{ runner.temp }}/epikrise-release
        shell: bash
        run: |
          set -euo pipefail
          host_target="$(rustc -vV | sed -n 's/^host: //p')"
          release_root="src-tauri/target/host-$host_target/$TARGET/release"
          node scripts/windows-packages.mjs verify-layout \
            "$release_root/windows-layout" "$TARGET" msi "$GITHUB_SHA" \
            "$(node -p "require('./package.json').version")"
          package_count="$(find "$release_root/windows-packages" -maxdepth 1 -type f | wc -l)"
          test "$package_count" -eq 8

      - uses: actions/upload-artifact@v7
        if: matrix.platform != 'windows'
        with:
          name: release-${{ matrix.target }}
          path: ${{ runner.temp }}/epikrise-release/release-staging/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

      - uses: actions/upload-artifact@v7
        if: matrix.platform == 'windows'
        with:
          name: windows-input-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/epikrise-release/src-tauri/target/host-${{ matrix.target }}/${{ matrix.target }}/release/windows-packages/
            ${{ runner.temp }}/epikrise-release/src-tauri/target/host-${{ matrix.target }}/${{ matrix.target }}/release/windows-layout/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  windows-msi:
    needs: build
    name: Stage Windows release ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    environment: release
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            windows_arch: x86_64
            runner: windows-2022
          - target: aarch64-pc-windows-msvc
            windows_arch: aarch64
            runner: windows-11-arm
    env:
      TARGET: ${{ matrix.target }}
      WINDOWS_ARCH: ${{ matrix.windows_arch }}

    steps:
      - uses: actions/checkout@v7
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: pnpm/setup@v2
        with:
          version: 12.10.1
          install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install WiX Toolset
        run: choco install wixtoolset --version=3.14.1 --yes --no-progress

      - name: Add WiX Toolset to PATH
        shell: pwsh
        run: |
          $wixPath = "${env:ProgramFiles(x86)}\WiX Toolset v3.14\bin"
          if (-not (Test-Path $wixPath)) {
            throw "WiX Toolset installation was not found at $wixPath"
          }
          $wixPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install source tooling
        run: pnpm install --frozen-lockfile

      - name: Prepare normalized release workspace
        shell: bash
        run: |
          set -euo pipefail
          build_root="$RUNNER_TEMP/epikrise-release"
          mkdir -p "$build_root"
          git archive "$GITHUB_SHA" | tar -x -C "$build_root"
          node scripts/prepare-release.mjs --prepare-build-inputs "$build_root"
          printf 'RELEASE_BUILD_ROOT=%s\n' "$build_root" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v8
        with:
          name: windows-input-${{ matrix.target }}
          path: ${{ runner.temp }}/windows-input

      - name: Install release workspace dependencies
        working-directory: ${{ runner.temp }}/epikrise-release
        run: pnpm install --frozen-lockfile

      - name: Build frontend without signing secrets
        working-directory: ${{ runner.temp }}/epikrise-release
        run: pnpm build

      - name: Verify and restore immutable MSI inputs
        working-directory: ${{ runner.temp }}/epikrise-release
        shell: bash
        run: |
          set -euo pipefail
          input_root="$RUNNER_TEMP/windows-input"
          layout_root="$input_root/windows-layout"
          version="$(node -p "require('./package.json').version")"
          node scripts/windows-packages.mjs verify-layout \
            "$layout_root" "$TARGET" msi "$GITHUB_SHA" "$version"
          cp -a "$layout_root/src-tauri/." src-tauri/
          host_target="$(rustc -vV | sed -n 's/^host: //p')"
          release_root="src-tauri/target/host-$host_target/$TARGET/release"
          mkdir -p "$release_root"
          cp "$layout_root/release/epikrise.exe" "$release_root/epikrise.exe"
          cp -a "$input_root/windows-packages" "$release_root/windows-packages"

      - name: Verify and stage native Windows release artifacts
        working-directory: ${{ runner.temp }}/epikrise-release
        shell: bash
        run: |
          set -euo pipefail
          host_target="$(rustc -vV | sed -n 's/^host: //p')"
          release_root="src-tauri/target/host-$host_target/$TARGET/release"
          node scripts/windows-packages.mjs verify-layout \
            "$release_root/windows-layout" "$TARGET" msi "$GITHUB_SHA" \
            "$(node -p "require('./package.json').version")"
          package_count="$(find "$release_root/windows-packages" -maxdepth 1 -type f | wc -l)"
          test "$package_count" -eq 8
          node scripts/release-artifacts.mjs stage \
            --target "$TARGET" \
            --bundle-root "$release_root/windows-packages" \
            --stage-root "release-staging/$TARGET" \
            --commit "$GITHUB_SHA" \
            --resource-root src-tauri/resources/ocr \
            --binary-root src-tauri/binaries

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: ${{ runner.temp }}/epikrise-release/release-staging/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  publish:
    needs:
      - build
      - windows-msi
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: pnpm/setup@v2
        with:
          version: 12.10.1
          install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Minisign verifier
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends minisign

      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-artifacts
          merge-multiple: false

      - name: Generate static updater manifest
        run: |
          node scripts/release-artifacts.mjs latest \
            --tag "$GITHUB_REF_NAME" \
            --commit "$GITHUB_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --artifacts-root release-artifacts \
            --output latest.json

      - name: Create or recover draft, then publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_file="$RUNNER_TEMP/existing-release.json"
          if gh release view "$GITHUB_REF_NAME" --json isDraft,tagName,body > "$release_file" 2>/dev/null; then
            node scripts/release-artifacts.mjs validate-draft \
              --tag "$GITHUB_REF_NAME" \
              --commit "$GITHUB_SHA" \
              --release-file "$release_file"
            gh release upload "$GITHUB_REF_NAME" \
              release-artifacts/*/* latest.json \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              release-artifacts/*/* latest.json \
              --draft \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              --notes "<!-- epikrise-signed-release-commit:$GITHUB_SHA -->" \
              --latest=false
          fi

          uploaded_release_file="$RUNNER_TEMP/uploaded-release.json"
          uploaded_assets_dir="$RUNNER_TEMP/uploaded-release-assets"
          mkdir -p "$uploaded_assets_dir"
          gh release view "$GITHUB_REF_NAME" --json assets > "$uploaded_release_file"
          gh release download "$GITHUB_REF_NAME" --dir "$uploaded_assets_dir"
          node scripts/release-artifacts.mjs verify-uploaded \
            --artifacts-root release-artifacts \
            --latest-file latest.json \
            --uploaded-root "$uploaded_assets_dir" \
            --release-file "$uploaded_release_file"

          latest_file="$RUNNER_TEMP/latest-release.json"
          latest_tag=""
          if gh release view --json tagName > "$latest_file" 2>/dev/null; then
            latest_tag="$(node --input-type=module -e \
              'import { readFileSync } from "node:fs"; process.stdout.write(JSON.parse(readFileSync(process.argv[1], "utf8")).tagName)' \
              "$latest_file")"
          else
            releases_file="$RUNNER_TEMP/releases.json"
            gh release list --json tagName,isDraft --limit 1000 > "$releases_file"
            node --input-type=module -e '
              import { readFileSync } from "node:fs";
              const releases = JSON.parse(readFileSync(process.argv[1], "utf8"));
              if (releases.some((release) => !release.isDraft)) {
                console.error("Could not determine the latest published release.");
                process.exit(1);
              }
            ' "$releases_file"
          fi
          promotion_args=(should-promote-latest --tag "$GITHUB_REF_NAME")
          if [[ -n "$latest_tag" ]]; then
            promotion_args+=(--latest-tag "$latest_tag")
          fi
          promote_latest="$(node scripts/release-artifacts.mjs "${promotion_args[@]}")"
          release_id="$(gh release view "$GITHUB_REF_NAME" --json databaseId --jq .databaseId)"
          if [[ "$promote_latest" == 'true' ]]; then
            make_latest=true
          else
            make_latest=false
          fi
          gh api --method PATCH \
            "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            -F draft=false \
            --raw-field "make_latest=$make_latest" > /dev/null
