name: Security audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, development]
  workflow_call:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: rust:1-bookworm
    steps:
      - uses: actions/checkout@v7
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/setup@v2
        with:
          version: 12.15.0
          install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit:pnpm
      - id: release_install
        continue-on-error: true
        timeout-minutes: 5
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.20.2
      - name: Install pinned tools from crates.io
        if: steps.release_install.outcome == 'failure'
        run: |
          cargo install --locked --force cargo-audit --version 0.22.2
          cargo install --locked --force cargo-deny --version 0.20.2
      - run: pnpm audit:rust
      - run: pnpm check:rust:deny
