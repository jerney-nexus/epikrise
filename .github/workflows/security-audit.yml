name: Security audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, development]
  workflow_call:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-22.04
    container:
      image: rust:1-bookworm
    steps:
      - uses: actions/checkout@v7
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/setup@v2
        with:
          version: 12.9.1
          install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit:pnpm
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny
      - run: pnpm audit:rust
      - run: pnpm check:rust:deny
