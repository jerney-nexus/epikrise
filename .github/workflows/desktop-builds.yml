name: Desktop builds
run-name: Desktop builds ${{ inputs.request_id }} @ ${{ inputs.expected_sha }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Unique request identifier from scripts/build:all
        required: true
        type: string
      expected_sha:
        description: Full commit SHA to build
        required: true
        type: string
      windows_arm64_symbols:
        description: Build the Windows ARM64 diagnostic installer with a matching PDB artifact
        required: false
        default: false
        type: boolean
      previous_store_version:
        description: Previous published Store version (for downgrade prevention)
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            platform: linux
            bundles: deb rpm appimage
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            platform: linux
            bundles: deb rpm appimage
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            platform: macos
            bundles: dmg
          - target: aarch64-apple-darwin
            runner: macos-15
            platform: macos
            bundles: dmg
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
            platform: windows
            windows_arch: x64
          - target: aarch64-pc-windows-msvc
            runner: windows-11-vs2026-arm
            platform: windows
            windows_arch: arm64

    env:
      TARGET: ${{ matrix.target }}
      PLATFORM: ${{ matrix.platform }}
      REQUEST_ID: ${{ inputs.request_id }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      ARTIFACT_STAGE: artifact-staging/${{ matrix.target }}
      EPIKRISE_NATIVE_BUILD_TARGET: ${{ matrix.target }}
      EPIKRISE_BUILD_MODE: diagnostic

    steps:
      - uses: actions/checkout@v7
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          ref: ${{ inputs.expected_sha }}
          persist-credentials: false

      - name: Verify requested commit
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_SHA" ]]
          [[ "$GITHUB_SHA" == "$EXPECTED_SHA" ]]
          [[ "$REQUEST_ID" =~ ^[0-9a-f-]{36}$ ]]
          archive_file="$RUNNER_TEMP/epikrise-source.tar"
          git archive "$EXPECTED_SHA" > "$archive_file"
          source_archive_sha256="$(node --input-type=module -e \
            'import { createHash } from "node:crypto"; import { readFileSync } from "node:fs"; process.stdout.write(createHash("sha256").update(readFileSync(process.argv[1])).digest("hex"));' \
            "$archive_file")"
          printf 'EPIKRISE_SOURCE_ARCHIVE_SHA256=%s\n' "$source_archive_sha256" >> "$GITHUB_ENV"

      - uses: pnpm/setup@v2
        with:
          version: 12.15.0
          install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache native OCR and Cargo inputs
        id: native-ocr-cache
        if: matrix.platform != 'windows'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/epikrise/native-ocr
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.runner }}-${{ matrix.target }}-diagnostic-ocr-${{ hashFiles('pnpm-lock.yaml', 'src-tauri/Cargo.lock', 'scripts/build-native-ocr.sh', 'scripts/verify-native-build-environment.mjs') }}

      - name: Cache Windows OCR sources and toolchain
        id: windows-ocr-cache
        if: matrix.platform == 'windows'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/epikrise/windows-ocr-native-msvc
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.runner }}-${{ matrix.target }}-diagnostic-windows-ocr-${{ hashFiles('pnpm-lock.yaml', 'src-tauri/Cargo.lock', 'scripts/build-native-windows.cmd', 'scripts/build-native-windows-ocr.sh', 'scripts/build-native-windows.sh', 'scripts/detect-windows-os-architecture.sh', 'scripts/verify-native-build-environment.mjs') }}

      - name: Capture cache restore details
        env:
          NATIVE_CACHE_KEY: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.runner }}-${{ matrix.target }}-diagnostic-ocr-${{ hashFiles('pnpm-lock.yaml', 'src-tauri/Cargo.lock', 'scripts/build-native-ocr.sh', 'scripts/verify-native-build-environment.mjs') }}
          WINDOWS_CACHE_KEY: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.runner }}-${{ matrix.target }}-diagnostic-windows-ocr-${{ hashFiles('pnpm-lock.yaml', 'src-tauri/Cargo.lock', 'scripts/build-native-windows.cmd', 'scripts/build-native-windows-ocr.sh', 'scripts/build-native-windows.sh', 'scripts/detect-windows-os-architecture.sh', 'scripts/verify-native-build-environment.mjs') }}
          NATIVE_CACHE_HIT: ${{ steps.native-ocr-cache.outputs.cache-hit }}
          WINDOWS_CACHE_HIT: ${{ steps.windows-ocr-cache.outputs.cache-hit }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$PLATFORM" == 'windows' ]]; then
            cache_key="$WINDOWS_CACHE_KEY"
            cache_restored="${WINDOWS_CACHE_HIT:-false}"
          else
            cache_key="$NATIVE_CACHE_KEY"
            cache_restored="${NATIVE_CACHE_HIT:-false}"
          fi
          printf 'EPIKRISE_CACHE_KEY=%s\n' "$cache_key" >> "$GITHUB_ENV"
          printf 'EPIKRISE_CACHE_RESTORED=%s\n' "$cache_restored" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify native build host and target
        env:
          EPIKRISE_RUNNER_OS: ${{ runner.os }}
          EPIKRISE_RUNNER_ARCH: ${{ runner.arch }}
        shell: bash
        run: bash scripts/with-cargo-host-target.sh --native-only --validate-only

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake curl file libfuse2t64 libssl-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev ninja-build \
            pkg-config patchelf ripgrep rpm tesseract-ocr tesseract-ocr-deu tesseract-ocr-eng

      - name: Install macOS OCR language data
        if: matrix.platform == 'macos'
        run: brew install ripgrep tesseract tesseract-lang

      - name: Install native Windows bundle dependencies
        if: matrix.platform == 'windows'
        shell: pwsh
        run: ./scripts/setup-native-windows-runner.ps1

      - name: Prepare target OCR resources
        if: matrix.platform != 'windows'
        run: bash scripts/prepare-ocr.sh --target "$TARGET"

      - name: Build Windows ARM64 diagnostic installer
        if: matrix.target == 'aarch64-pc-windows-msvc' && inputs.windows_arm64_symbols
        env:
          WINDOWS_ARCH: arm64
          CARGO_PROFILE_RELEASE_DEBUG: "2"
          CARGO_PROFILE_RELEASE_STRIP: none
        shell: cmd
        run: call scripts\build-native-windows.cmd "%WINDOWS_ARCH%" diagnostic

      - name: Build Windows installer
        if: matrix.platform == 'windows' && (matrix.target != 'aarch64-pc-windows-msvc' || !inputs.windows_arm64_symbols)
        env:
          WINDOWS_ARCH: ${{ matrix.windows_arch }}
        shell: cmd
        run: call scripts\build-native-windows.cmd "%WINDOWS_ARCH%" diagnostic

      - name: Build Linux or macOS bundles
        if: matrix.platform != 'windows'
        env:
          BUNDLE_TARGETS: ${{ matrix.bundles }}
        shell: bash
        run: |
          read -r -a bundles <<< "$BUNDLE_TARGETS"
          pnpm tauri build --target "$TARGET" --bundles "${bundles[@]}" --no-sign

      - name: Verify staged OCR architectures
        shell: bash
        run: |
          app_binary="$(bash scripts/tauri-build-output.sh "$TARGET" --target "$TARGET")"
          test -s "$app_binary"
          node scripts/verify-binary-architecture.mjs "$TARGET" "$app_binary"
          case "$TARGET" in
            x86_64-unknown-linux-gnu)
              readelf -h "src-tauri/binaries/tesseract-$TARGET" | grep -F 'Advanced Micro Devices X86-64'
              readelf -h src-tauri/resources/ocr/pdfium/libpdfium.so | grep -F 'Advanced Micro Devices X86-64'
              ;;
            aarch64-unknown-linux-gnu)
              readelf -h "src-tauri/binaries/tesseract-$TARGET" | grep -F 'AArch64'
              readelf -h src-tauri/resources/ocr/pdfium/libpdfium.so | grep -F 'AArch64'
              ;;
            x86_64-apple-darwin)
              lipo "src-tauri/binaries/tesseract-$TARGET" -archs | grep -qw x86_64
              lipo src-tauri/resources/ocr/pdfium/libpdfium.dylib -archs | grep -qw x86_64
              ;;
            aarch64-apple-darwin)
              lipo "src-tauri/binaries/tesseract-$TARGET" -archs | grep -qw arm64
              lipo src-tauri/resources/ocr/pdfium/libpdfium.dylib -archs | grep -qw arm64
              ;;
            x86_64-pc-windows-msvc|aarch64-pc-windows-msvc)
              node scripts/verify-binary-architecture.mjs "$TARGET" "src-tauri/binaries/tesseract-$TARGET.exe"
              node scripts/verify-binary-architecture.mjs "$TARGET" src-tauri/resources/ocr/pdfium/pdfium.dll
              ;;
          esac

      - name: Create unsigned Store MSIX
        if: matrix.platform == 'windows'
        env:
          WINDOWS_ARCH: ${{ matrix.windows_arch }}
          TARGET: ${{ matrix.target }}
          PREVIOUS_STORE_VERSION: ${{ inputs.previous_store_version }}
        shell: pwsh
        run: |
          $hostLine = (rustc -vV | Select-String '^host: ').Line
          if (-not $hostLine) {
            throw "Unable to determine the native Rust host target."
          }
          $hostTarget = $hostLine -replace '^host: ', ''
          $buildDirectory = "src-tauri/target/host-$hostTarget/$env:TARGET/release"
          $arguments = @{
            Architecture = $env:WINDOWS_ARCH
            Target = $env:TARGET
            BuildDirectory = $buildDirectory
            OutputDirectory = "artifact-staging/store-msix"
          }
          if ($env:PREVIOUS_STORE_VERSION) {
            $arguments.PreviousStoreVersion = $env:PREVIOUS_STORE_VERSION
          }
          ./scripts/package-store-msix.ps1 @arguments

      - name: Stage Store MSIX with integrity manifest
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          host_target="$(rustc -vV | sed -n 's/^host: //p')"
          node scripts/desktop-builds.mjs stage \
            --target "$TARGET" \
            --package-family store-msix \
            --bundle-root artifact-staging/store-msix \
            --stage-root artifact-staging/store-msix-artifact \
            --commit "$EXPECTED_SHA" \
            --request-id "$REQUEST_ID" \
            --runner-os "$RUNNER_OS" \
            --runner-arch "$RUNNER_ARCH" \
            --rust-host "$host_target" \
            --build-mode "$EPIKRISE_BUILD_MODE" \
            --source-archive-sha256 "$EPIKRISE_SOURCE_ARCHIVE_SHA256" \
            --cache-key "$EPIKRISE_CACHE_KEY" \
            --cache-restored "$EPIKRISE_CACHE_RESTORED"

      - uses: actions/upload-artifact@v7
        if: matrix.platform == 'windows'
        with:
          name: epikrise-store-msix-${{ matrix.windows_arch }}
          path: artifact-staging/store-msix-artifact/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Stage packages and manifest
        shell: bash
        run: |
          host_target="$(rustc -vV | sed -n 's/^host: //p')"
          node scripts/desktop-builds.mjs stage \
            --target "$TARGET" \
            --package-family desktop \
            --commit "$EXPECTED_SHA" \
            --request-id "$REQUEST_ID" \
            --runner-os "$RUNNER_OS" \
            --runner-arch "$RUNNER_ARCH" \
            --rust-host "$host_target" \
            --build-mode "$EPIKRISE_BUILD_MODE" \
            --source-archive-sha256 "$EPIKRISE_SOURCE_ARCHIVE_SHA256" \
            --cache-key "$EPIKRISE_CACHE_KEY" \
            --cache-restored "$EPIKRISE_CACHE_RESTORED" \
            --bundle-root "src-tauri/target/host-$host_target/$TARGET/release/bundle" \
            --stage-root "$ARTIFACT_STAGE"

      - uses: actions/upload-artifact@v7
        with:
          name: epikrise-${{ matrix.target }}
          path: artifact-staging/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Stage Windows ARM64 diagnostic symbols
        if: matrix.target == 'aarch64-pc-windows-msvc' && inputs.windows_arm64_symbols
        shell: bash
        run: |
          host_target="$(rustc -vV | sed -n 's/^host: //p')"
          build_dir="src-tauri/target/host-$host_target/$TARGET/release"
          test -s "$build_dir/epikrise.exe"
          test -s "$build_dir/epikrise.pdb"
          mkdir -p diagnostic-symbols
          cp "$build_dir/epikrise.exe" diagnostic-symbols/
          cp "$build_dir/epikrise.pdb" diagnostic-symbols/

      - uses: actions/upload-artifact@v7
        if: matrix.target == 'aarch64-pc-windows-msvc' && inputs.windows_arm64_symbols
        with:
          name: epikrise-aarch64-pc-windows-msvc-symbols
          path: diagnostic-symbols/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
