name: Desktop builds
run-name: Desktop builds ${{ inputs.request_id }} @ ${{ inputs.expected_sha }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Unique request identifier from scripts/build:all
        required: true
        type: string
      expected_sha:
        description: Full commit SHA to build
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            platform: linux
            bundles: deb rpm appimage
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
            platform: linux
            bundles: deb rpm appimage
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            platform: macos
            bundles: dmg
          - target: aarch64-apple-darwin
            runner: macos-15
            platform: macos
            bundles: dmg
          - target: x86_64-pc-windows-msvc
            runner: windows-2022
            platform: windows
            windows_arch: x64
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            platform: windows
            windows_arch: arm64

    env:
      TARGET: ${{ matrix.target }}
      PLATFORM: ${{ matrix.platform }}
      REQUEST_ID: ${{ inputs.request_id }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      ARTIFACT_STAGE: artifact-staging/${{ matrix.target }}

    steps:
      - uses: actions/checkout@v7
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          ref: ${{ inputs.expected_sha }}
          persist-credentials: false

      - name: Verify requested commit
        shell: bash
        run: |
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_SHA" ]]
          [[ "$GITHUB_SHA" == "$EXPECTED_SHA" ]]
          [[ "$REQUEST_ID" =~ ^[0-9a-f-]{36}$ ]]

      - uses: pnpm/setup@v2
        with:
          version: 12.10.1
          install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache native OCR and Cargo inputs
        if: matrix.platform != 'windows'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/epikrise/native-ocr
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-ocr-${{ hashFiles('pnpm-lock.yaml', 'src-tauri/Cargo.lock', 'scripts/build-native-ocr.sh') }}

      - name: Cache Windows OCR sources and toolchain
        if: matrix.platform == 'windows'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/epikrise/windows-ocr
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-windows-ocr-${{ hashFiles('pnpm-lock.yaml', 'src-tauri/Cargo.lock', 'scripts/build-windows-ocr.sh') }}

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake curl file libfuse2 libssl-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev ninja-build \
            pkg-config patchelf ripgrep rpm tesseract-ocr tesseract-ocr-deu tesseract-ocr-eng

      - name: Install macOS OCR language data
        if: matrix.platform == 'macos'
        run: brew install ripgrep tesseract tesseract-lang

      - name: Install native Windows build tools
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          choco install llvm nsis --yes --no-progress
          $tessdata = Join-Path $env:RUNNER_TEMP "epikrise-tessdata"
          New-Item -ItemType Directory -Force -Path $tessdata | Out-Null
          $models = @{
            "eng" = "7d4322bd2a7749724879683fc3912cb542f19906c83bcc1a52132556427170b2"
            "deu" = "19d219bbb6672c869d20a9636c6816a81eb9a71796cb93ebe0cb1530e2cdb22d"
          }
          $revision = "87416418657359cb625c412a48b6e1d6d41c29bd"
          foreach ($model in $models.Keys) {
            $destination = Join-Path $tessdata "$model.traineddata"
            Invoke-WebRequest -Uri "https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/$revision/$model.traineddata" -OutFile $destination
            if ((Get-FileHash -Algorithm SHA256 $destination).Hash.ToLowerInvariant() -ne $models[$model]) {
              throw "SHA-256 mismatch for $model.traineddata"
            }
          }
          "EPIKRISE_TESSDATA_DIR=$($tessdata -replace '\\', '/')" >> $env:GITHUB_ENV

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare target OCR resources
        run: bash scripts/prepare-ocr.sh --target "$TARGET"

      - name: Verify staged OCR architectures
        shell: bash
        run: |
          case "$TARGET" in
            x86_64-unknown-linux-gnu)
              readelf -h "src-tauri/binaries/tesseract-$TARGET" | grep -F 'Advanced Micro Devices X86-64'
              readelf -h src-tauri/resources/ocr/pdfium/libpdfium.so | grep -F 'Advanced Micro Devices X86-64'
              ;;
            aarch64-unknown-linux-gnu)
              readelf -h "src-tauri/binaries/tesseract-$TARGET" | grep -F 'AArch64'
              readelf -h src-tauri/resources/ocr/pdfium/libpdfium.so | grep -F 'AArch64'
              ;;
            x86_64-apple-darwin)
              lipo "src-tauri/binaries/tesseract-$TARGET" -archs | grep -qw x86_64
              lipo src-tauri/resources/ocr/pdfium/libpdfium.dylib -archs | grep -qw x86_64
              ;;
            aarch64-apple-darwin)
              lipo "src-tauri/binaries/tesseract-$TARGET" -archs | grep -qw arm64
              lipo src-tauri/resources/ocr/pdfium/libpdfium.dylib -archs | grep -qw arm64
              ;;
            x86_64-pc-windows-msvc)
              llvm-readobj --file-headers "src-tauri/target/host-$TARGET/$TARGET/release/epikrise.exe" | grep -F IMAGE_FILE_MACHINE_AMD64
              llvm-readobj --file-headers "src-tauri/binaries/tesseract-$TARGET.exe" | grep -F IMAGE_FILE_MACHINE_AMD64
              llvm-readobj --file-headers src-tauri/resources/ocr/pdfium/pdfium.dll | grep -F IMAGE_FILE_MACHINE_AMD64
              ;;
            aarch64-pc-windows-msvc)
              llvm-readobj --file-headers "src-tauri/target/host-$TARGET/$TARGET/release/epikrise.exe" | grep -F IMAGE_FILE_MACHINE_ARM64
              llvm-readobj --file-headers "src-tauri/binaries/tesseract-$TARGET.exe" | grep -F IMAGE_FILE_MACHINE_ARM64
              llvm-readobj --file-headers src-tauri/resources/ocr/pdfium/pdfium.dll | grep -F IMAGE_FILE_MACHINE_ARM64
              ;;
          esac

      - name: Build Windows installer
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          bash scripts/with-cargo-host-target.sh \
            pnpm exec tauri build --target "$TARGET" --bundles nsis --ci --no-sign

      - name: Build Windows MSIX package
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          host_target="$(rustc -vV | sed -n 's/^host: //p')"
          pwsh -NoProfile -File scripts/build-windows-msix.ps1 \
            -Target "$TARGET" \
            -ReleaseRoot "src-tauri/target/host-$host_target/$TARGET/release"

      - name: Build Linux or macOS bundles
        if: matrix.platform != 'windows'
        env:
          BUNDLE_TARGETS: ${{ matrix.bundles }}
        shell: bash
        run: |
          read -r -a bundles <<< "$BUNDLE_TARGETS"
          bash scripts/with-cargo-host-target.sh \
            pnpm exec tauri build --target "$TARGET" --bundles "${bundles[@]}" --no-sign

      - name: Stage packages and manifest
        shell: bash
        run: |
          host_target="$(rustc -vV | sed -n 's/^host: //p')"
          node scripts/desktop-builds.mjs stage \
            --target "$TARGET" \
            --commit "$EXPECTED_SHA" \
            --request-id "$REQUEST_ID" \
            --bundle-root "src-tauri/target/host-$host_target/$TARGET/release/bundle" \
            --stage-root "$ARTIFACT_STAGE"

      - uses: actions/upload-artifact@v7
        with:
          name: epikrise-${{ matrix.target }}
          path: artifact-staging/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
