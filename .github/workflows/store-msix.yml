name: Store MSIX packages

on:
  workflow_call:
    inputs:
      commit:
        description: Full commit SHA to package
        required: true
        type: string
      release_tag:
        description: Release tag to validate against the commit (empty for desktop builds)
        required: false
        type: string
        default: ""
      request_id:
        description: Request identifier (derived from the commit when empty)
        required: false
        type: string
        default: ""
      previous_store_version:
        description: Previous published Store version (for downgrade prevention)
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: Build Store MSIX ${{ matrix.architecture }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            target: x86_64-pc-windows-msvc
            runner: windows-2025
          - architecture: arm64
            target: aarch64-pc-windows-msvc
            runner: windows-11-vs2026-arm
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      RELEASE_SHA: ${{ inputs.commit }}
      REQUEST_ID: ${{ inputs.request_id }}
      PREVIOUS_STORE_VERSION: ${{ inputs.previous_store_version }}
      WINDOWS_ARCH: ${{ matrix.architecture }}
      TARGET: ${{ matrix.target }}
      EPIKRISE_NATIVE_BUILD_TARGET: ${{ matrix.target }}
      EPIKRISE_BUILD_MODE: diagnostic
    steps:
      - uses: actions/checkout@v7
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false

      - uses: pnpm/setup@v2
        with:
          version: 12.15.0
          install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install source tooling
        run: pnpm install --frozen-lockfile

      - name: Validate release tag and commit
        if: inputs.release_tag != ''
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          node scripts/release-artifacts.mjs validate --tag "$RELEASE_TAG"
          [[ "$(git rev-parse HEAD)" == "$RELEASE_SHA" ]]
          [[ "$(git rev-parse "${RELEASE_TAG}^{commit}")" == "$RELEASE_SHA" ]]

      - name: Verify native build host and target
        env:
          EPIKRISE_RUNNER_OS: ${{ runner.os }}
          EPIKRISE_RUNNER_ARCH: ${{ runner.arch }}
        shell: bash
        run: bash scripts/with-cargo-host-target.sh --native-only --validate-only

      - name: Prepare normalized Store build workspace
        shell: bash
        run: |
          set -euo pipefail
          build_root="$RUNNER_TEMP/epikrise-store-release"
          source_archive_sha256="$(
            node scripts/prepare-release-workspace.mjs "$RELEASE_SHA" "$build_root"
          )"
          request_id="$REQUEST_ID"
          if [[ -z "$request_id" ]]; then
            sha="$RELEASE_SHA"
            request_id="${sha:0:8}-${sha:8:4}-${sha:12:4}-${sha:16:4}-${sha:20:12}"
          fi
          {
            printf 'RELEASE_BUILD_ROOT=%s\n' "$build_root"
            printf 'EPIKRISE_SOURCE_ARCHIVE_SHA256=%s\n' "$source_archive_sha256"
            printf 'STORE_REQUEST_ID=%s\n' "$request_id"
          } >> "$GITHUB_ENV"

      - name: Cache Windows OCR sources and toolchain
        id: windows-ocr-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/epikrise/windows-ocr-native-msvc
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.runner }}-${{ matrix.target }}-store-msix-windows-ocr-${{ hashFiles('pnpm-lock.yaml', 'src-tauri/Cargo.lock', 'scripts/build-native-windows.cmd', 'scripts/build-native-windows-ocr.sh', 'scripts/build-native-windows.sh', 'scripts/detect-windows-os-architecture.sh', 'scripts/verify-native-build-environment.mjs') }}

      - name: Capture cache restore details
        env:
          WINDOWS_CACHE_KEY: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.runner }}-${{ matrix.target }}-store-msix-windows-ocr-${{ hashFiles('pnpm-lock.yaml', 'src-tauri/Cargo.lock', 'scripts/build-native-windows.cmd', 'scripts/build-native-windows-ocr.sh', 'scripts/build-native-windows.sh', 'scripts/detect-windows-os-architecture.sh', 'scripts/verify-native-build-environment.mjs') }}
          WINDOWS_CACHE_HIT: ${{ steps.windows-ocr-cache.outputs.cache-hit }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'EPIKRISE_CACHE_KEY=%s\n' "$WINDOWS_CACHE_KEY" >> "$GITHUB_ENV"
          printf 'EPIKRISE_CACHE_RESTORED=%s\n' "${WINDOWS_CACHE_HIT:-false}" >> "$GITHUB_ENV"

      - name: Install release workspace dependencies
        working-directory: ${{ runner.temp }}/epikrise-store-release
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: ${{ runner.temp }}/epikrise-store-release
        run: pnpm build

      - name: Install native Windows bundle dependencies
        working-directory: ${{ runner.temp }}/epikrise-store-release
        shell: pwsh
        run: ./scripts/setup-native-windows-runner.ps1

      - name: Build native Windows application without updater features
        working-directory: ${{ runner.temp }}/epikrise-store-release
        shell: cmd
        run: call scripts\build-native-windows.cmd "%WINDOWS_ARCH%" diagnostic

      - name: Verify staged Windows binary architectures
        working-directory: ${{ runner.temp }}/epikrise-store-release
        shell: bash
        run: |
          set -euo pipefail
          app_binary="$(bash scripts/tauri-build-output.sh "$TARGET" --target "$TARGET")"
          test -s "$app_binary"
          node scripts/verify-binary-architecture.mjs "$TARGET" "$app_binary"
          node scripts/verify-binary-architecture.mjs "$TARGET" "src-tauri/binaries/tesseract-$TARGET.exe"
          node scripts/verify-binary-architecture.mjs "$TARGET" src-tauri/resources/ocr/pdfium/pdfium.dll

      - name: Create unsigned Store MSIX
        working-directory: ${{ runner.temp }}/epikrise-store-release
        shell: pwsh
        run: |
          $hostLine = (rustc -vV | Select-String '^host: ').Line
          if (-not $hostLine) {
            throw "Unable to determine the native Rust host target."
          }
          $hostTarget = $hostLine -replace '^host: ', ''
          $buildDirectory = "src-tauri/target/host-$hostTarget/$env:TARGET/release"
          $arguments = @{
            Architecture = $env:WINDOWS_ARCH
            Target = $env:TARGET
            BuildDirectory = $buildDirectory
            OutputDirectory = "artifact-staging/store-msix"
          }
          if ($env:PREVIOUS_STORE_VERSION) {
            $arguments.PreviousStoreVersion = $env:PREVIOUS_STORE_VERSION
          }
          ./scripts/package-store-msix.ps1 @arguments

      - name: Stage Store MSIX with integrity manifest
        working-directory: ${{ runner.temp }}/epikrise-store-release
        shell: bash
        run: |
          set -euo pipefail
          host_target="$(rustc -vV | sed -n 's/^host: //p')"
          node scripts/desktop-builds.mjs stage \
            --target "$TARGET" \
            --package-family store-msix \
            --bundle-root artifact-staging/store-msix \
            --stage-root artifact-staging/store-msix-artifact \
            --commit "$RELEASE_SHA" \
            --request-id "$STORE_REQUEST_ID" \
            --runner-os "$RUNNER_OS" \
            --runner-arch "$RUNNER_ARCH" \
            --rust-host "$host_target" \
            --build-mode "$EPIKRISE_BUILD_MODE" \
            --source-archive-sha256 "$EPIKRISE_SOURCE_ARCHIVE_SHA256" \
            --cache-key "$EPIKRISE_CACHE_KEY" \
            --cache-restored "$EPIKRISE_CACHE_RESTORED"

      - uses: actions/upload-artifact@v7
        with:
          name: epikrise-store-msix-${{ matrix.architecture }}
          path: ${{ runner.temp }}/epikrise-store-release/artifact-staging/store-msix-artifact/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  bundle:
    needs: build
    name: Build Store MSIX bundle
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      RELEASE_SHA: ${{ inputs.commit }}
    steps:
      - uses: actions/checkout@v7
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          pattern: epikrise-store-msix-*
          path: store-artifacts
          merge-multiple: false

      - name: Create and verify Store bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $packages = @{}
          foreach ($architecture in @("x64", "arm64")) {
            $found = @(Get-ChildItem -LiteralPath "store-artifacts/epikrise-store-msix-$architecture" `
                -Filter "Epikrise_*_$architecture.msix" -File -Recurse)
            if ($found.Count -ne 1) {
              throw "Expected one $architecture Store package, found $($found.Count)."
            }
            $packages[$architecture] = $found[0].FullName
          }
          & "$env:GITHUB_WORKSPACE/scripts/package-store-msixbundle.ps1" `
            -X64Package $packages["x64"] `
            -Arm64Package $packages["arm64"] `
            -OutputDirectory "store-bundle"
          if ($LASTEXITCODE -ne 0) {
            throw "Store bundle creation failed."
          }

      - name: Write Store bundle checksum
        shell: bash
        run: |
          set -euo pipefail
          bundles=(store-bundle/Epikrise_*_bundle.msixbundle)
          [[ ${#bundles[@]} -eq 1 && -f "${bundles[0]}" ]]
          bundle_name="$(basename "${bundles[0]}")"
          (cd store-bundle && sha256sum "$bundle_name" > "$bundle_name.sha256")

      - uses: actions/upload-artifact@v7
        with:
          name: epikrise-store-msixbundle
          path: store-bundle
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
