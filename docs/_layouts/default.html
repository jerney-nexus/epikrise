<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f2f5f1" />
    <meta
      name="description"
      content="{{ page.description | default: site.description | escape }}"
    />
    <title>
      {% if page.title and page.title != site.title %}{{ page.title | escape }} · {%
      endif %}{{ site.title | escape }}
    </title>
    <link rel="canonical" href="{{ page.url | absolute_url }}" />
    <link
      rel="icon"
      type="image/png"
      href="{{ '/assets/favicon.png' | relative_url }}"
    />
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}" />
    {% include theme-init.html %}
    <script src="{{ '/assets/js/theme.js' | relative_url }}" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main" lang="en">Skip to content</a>
    {% include header.html %}
    <main id="main">{{ content }}</main>
    {% include footer.html %}
  </body>
</html>
