<!doctype html>
<html lang="%lang%">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f2f5f1" />
    <meta
      name="description"
      content="Epikrise, a local-only drafting aid for clinical material"
    />
    <link rel="icon" type="image/png" href="%sveltekit.assets%/favicon.png" />
    <script>
      // Sets the theme before first paint. Mirrors themePreferenceKey in src/lib/components/ThemePreference.svelte.
      (function () {
        var systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        var stored = null;
        try {
          stored = localStorage.getItem("epikrise.ui-theme");
        } catch (error) {
          stored = null;
        }
        var dark = stored === "dark" || (stored !== "light" && systemDark);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
    %sveltekit.head%
  </head>
  <body>
    %sveltekit.body%
  </body>
</html>
