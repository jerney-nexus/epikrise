<script>
  // Sets the theme before first paint. Mirrors src/app.html and src/lib/theme.ts.
  (function () {
    var systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
    var stored = null;
    try {
      stored = localStorage.getItem("epikrise.ui-theme");
    } catch (error) {
      stored = null;
    }
    var dark = stored === "dark" || (stored !== "light" && systemDark);
    document.documentElement.dataset.theme = dark ? "dark" : "light";
  })();
</script>
