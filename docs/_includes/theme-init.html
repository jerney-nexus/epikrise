<script>
  // Sets the theme before first paint. Mirrors src/app.html and src/lib/theme.ts.
  (function () {
    var dark = false;
    try {
      var stored = localStorage.getItem("epikrise.ui-theme");
      dark =
        stored === "dark" ||
        (stored !== "light" &&
          window.matchMedia("(prefers-color-scheme: dark)").matches);
    } catch (error) {
      dark = false;
    }
    document.documentElement.dataset.theme = dark ? "dark" : "light";
  })();
</script>
