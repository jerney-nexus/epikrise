<header class="site-header">
  <div class="site-header__inner">
    <a class="site-brand" href="{{ '/' | relative_url }}">
      <span class="site-brand__mark" aria-hidden="true">E</span>
      <span class="site-brand__name">{{ site.title }}</span>
    </a>
    <nav class="site-nav" aria-label="Main">
      <a href="{{ '/' | relative_url }}#download">Download</a>
      <a href="{{ '/privacy-policy/en/' | relative_url }}">Privacy</a>
      <a href="https://github.com/jerney-nexus/epikrise">GitHub</a>
    </nav>
    <label class="theme-select">
      <span>Theme</span>
      <select id="theme-preference">
        <option value="auto">Auto</option>
        <option value="light">Light</option>
        <option value="dark">Dark</option>
      </select>
    </label>
  </div>
</header>
