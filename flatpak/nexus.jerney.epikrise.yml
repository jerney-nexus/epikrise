app-id: nexus.jerney.epikrise
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node22
command: epikrise
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
modules:
  - name: zlib
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_INSTALL_PREFIX=/app
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_SHARED_LIBS=OFF
      - -DZLIB_BUILD_EXAMPLES=OFF
    sources:
      - type: archive
        url: https://zlib.net/fossils/zlib-1.3.1.tar.gz
        sha256: 9a93b2b7dfdac77ceba5a558a580e74667dd6fede4585b91eefb60f03b72df23

  - name: libpng
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_INSTALL_PREFIX=/app
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_SHARED_LIBS=OFF
      - -DPNG_SHARED=OFF
      - -DPNG_STATIC=ON
      - -DPNG_TESTS=OFF
      - -DPNG_TOOLS=OFF
      - -DZLIB_USE_STATIC_LIBS=ON
    sources:
      - type: archive
        url: https://github.com/glennrp/libpng/archive/refs/tags/v1.6.50.tar.gz
        sha256: 71158e53cfdf2877bc99bcab33641d78df3f48e6e0daad030afe9cb8c031aa46

  - name: leptonica
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_INSTALL_PREFIX=/app
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_SHARED_LIBS=OFF
      - -DZLIB_USE_STATIC_LIBS=ON
      - -DBUILD_PROG=OFF
      - -DSW_BUILD=OFF
      - -DENABLE_ZLIB=ON
      - -DENABLE_PNG=ON
      - -DENABLE_GIF=OFF
      - -DENABLE_JPEG=OFF
      - -DENABLE_TIFF=OFF
      - -DENABLE_WEBP=OFF
      - -DENABLE_OPENJPEG=OFF
    sources:
      - type: archive
        url: https://github.com/DanBloomberg/leptonica/archive/refs/tags/1.85.0.tar.gz
        sha256: c01376bce0379d4ea4bc2ec5d5cbddaa49e2f06f88242619ab8c059e21adf233

  - name: tesseract
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_INSTALL_PREFIX=/app
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_SHARED_LIBS=OFF
      - -DBUILD_TRAINING_TOOLS=OFF
      - -DBUILD_TESTS=OFF
      - -DDISABLE_ARCHIVE=ON
      - -DDISABLE_CURL=ON
      - -DDISABLE_TIFF=ON
      - -DOPENMP_BUILD=OFF
      - -DSW_BUILD=OFF
      - -DLEPT_TIFF_RESULT:STRING=1
      - -DLEPT_TIFF_COMPILE_SUCCESS:BOOL=TRUE
      - -DLeptonica_DIR=/app/lib/cmake/leptonica
    cleanup:
      - /include
      - /lib/cmake
      - /lib/pkgconfig
      - "*.a"
    sources:
      - type: archive
        url: https://github.com/tesseract-ocr/tesseract/archive/refs/tags/5.5.0.tar.gz
        sha256: f2fb34ca035b6d087a42875a35a7a5c4155fa9979c6132365b1e5a28ebc3fc11

  - name: epikrise
    buildsystem: simple
    build-options:
      prepend-path: /run/build/epikrise/tools/bin:/usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/node22/bin
      env:
        CARGO_HOME: /run/build/epikrise/cargo
        CARGO_NET_OFFLINE: "true"
        PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    sources:
      - type: dir
        path: ..
        skip:
          - .git
          - node_modules
          - build
          - docs/node_modules
          - docs/.svelte-kit
          - src-tauri/target
          - flatpak/.flatpak-builder
          - flatpak/node-sources.json
          - flatpak/cargo-sources.json
      - cargo-sources.json
      - node-sources.json
      - type: archive
        only-arches: [x86_64]
        url: https://registry.npmjs.org/@pnpm/exe.linux-x64/-/exe.linux-x64-12.15.0.tgz
        sha512: c9cf9095947ef7e9ebdbd2787d1ce13286a98314c10e776affea5eca8ab55d4b9f9d01677db5d4305b9d0c82b31e2e78e658a71aa98e9977e7d0da2e7cd81c3a
        strip-components: 1
        dest: tools/pnpm-x86_64
      - type: archive
        only-arches: [aarch64]
        url: https://registry.npmjs.org/@pnpm/exe.linux-arm64/-/exe.linux-arm64-12.15.0.tgz
        sha512: a8c2fff1a097b2587cb5dff0e14f8724da94719dbe9ba11f4db592708cd9466c8fb1114dfb10782cfd54fe1ca6c5cd6248988ab46e7a1c9c767ef504ad61481b
        strip-components: 1
        dest: tools/pnpm-aarch64
      - type: script
        dest: tools/bin
        dest-filename: pnpm
        commands:
          - |
            case "$(uname -m)" in
              x86_64) pnpm_arch=x86_64 ;;
              aarch64) pnpm_arch=aarch64 ;;
              *) echo "unsupported architecture: $(uname -m)" >&2; exit 1 ;;
            esac
            exec "$(dirname "$0")/../pnpm-${pnpm_arch}/pnpm" "$@"
      - type: archive
        only-arches: [x86_64]
        url: https://github.com/bblanchon/pdfium-binaries/releases/download/chromium/8066/pdfium-linux-x64.tgz
        sha256: 0b43f405477cf2cfc4dbff06905093c3309756c6bca1fb9da99234a2ca97fed2
        dest: pdfium/x86_64
      - type: archive
        only-arches: [aarch64]
        url: https://github.com/bblanchon/pdfium-binaries/releases/download/chromium/8066/pdfium-linux-arm64.tgz
        sha256: 0e6f90dccbc6b81fd5d7106abaf164c4222178f024c204d00d526b60fd2ad535
        dest: pdfium/aarch64
      - type: file
        url: https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/87416418657359cb625c412a48b6e1d6d41c29bd/deu.traineddata
        sha256: 19d219bbb6672c869d20a9636c6816a81eb9a71796cb93ebe0cb1530e2cdb22d
        dest: tessdata
      - type: file
        url: https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/87416418657359cb625c412a48b6e1d6d41c29bd/eng.traineddata
        sha256: 7d4322bd2a7749724879683fc3912cb542f19906c83bcc1a52132556427170b2
        dest: tessdata
      - type: file
        url: https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/87416418657359cb625c412a48b6e1d6d41c29bd/fra.traineddata
        sha256: ced037562e8c80c13122dece28dd477d399af80911a28791a66a63ac1e3445ca
        dest: tessdata
      - type: file
        url: https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/87416418657359cb625c412a48b6e1d6d41c29bd/ita.traineddata
        sha256: b8f89e1e785118dac4d51ae042c029a64edb5c3ee42ef73027a6d412748d8827
        dest: tessdata
      - type: file
        url: https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/87416418657359cb625c412a48b6e1d6d41c29bd/spa.traineddata
        sha256: 6f2e04d02774a18f01bed44b1111f2cd7f3ba7ac9dc4373cd3f898a40ea6b464
        dest: tessdata
    build-commands:
      - |
        set -euo pipefail
        # The sandbox has no registry metadata, so the supply-chain policy
        # check cannot run; integrity comes from the lockfile and node-sources.json.
        pnpm install --frozen-lockfile --offline --trust-lockfile
        pnpm build
        triple="$(rustc -vV | sed -n 's/^host: //p')"
        mkdir -p src-tauri/binaries src-tauri/resources/ocr/pdfium src-tauri/resources/ocr/tessdata
        cp /app/bin/tesseract "src-tauri/binaries/tesseract-${triple}"
        case "$(uname -m)" in
          x86_64) pdfium_dir=pdfium/x86_64 ;;
          aarch64) pdfium_dir=pdfium/aarch64 ;;
          *) echo "unsupported architecture: $(uname -m)" >&2; exit 1 ;;
        esac
        cp "${pdfium_dir}/lib/libpdfium.so" src-tauri/resources/ocr/pdfium/
        cp tessdata/*.traineddata src-tauri/resources/ocr/tessdata/
        cargo build --release --offline --manifest-path src-tauri/Cargo.toml --features tauri/custom-protocol
        install -Dm755 src-tauri/target/release/epikrise /app/bin/epikrise
        mkdir -p /app/lib/epikrise/resources
        cp -r src-tauri/resources/ocr /app/lib/epikrise/resources/
        install -Dm644 flatpak/nexus.jerney.epikrise.desktop /app/share/applications/nexus.jerney.epikrise.desktop
        install -Dm644 flatpak/nexus.jerney.epikrise.metainfo.xml /app/share/metainfo/nexus.jerney.epikrise.metainfo.xml
        install -Dm644 src-tauri/icons/icon.png /app/share/icons/hicolor/512x512/apps/nexus.jerney.epikrise.png
